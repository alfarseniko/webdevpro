<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In</title>
    <link href="./output.css" rel="stylesheet" />
  </head>
  <body
    class="bg-gray-900 text-white flex flex-col justify-center items-center min-h-screen"
  >
    <div
      class="bg-gray-700 flex flex-col items-center justify-center rounded-lg p-8 shadow-lg max-w-sm w-full"
    >
      <h1 class="text-center text-3xl mb-6 font-bold">Login</h1>
      <form action="" class="w-5/6">
        <div class="mb-4">
          <label for="" class="block text-sm font-medium mb-2">Email</label>
          <input
            type="email"
            name=""
            id=""
            placeholder="Email"
            class="w-full px-3 py-1 bg-gray-600 border-gray-950 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-black"
          />
        </div>
        <div>
          <label class="block text-sm font-medium mb-2" for="">Password</label>
          <input
            type="password"
            name=""
            id=""
            placeholder="Password"
            class="w-full px-3 py-1 bg-gray-600 border-gray-950 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-black"
          />
        </div>
        <button
          type="submit"
          class="w-full bg-gray-900 mt-5 rounded-md py-2 text-sm font-semibold hover:bg-gray-400 hover:text-black"
        >
          Login
        </button>
      </form>
    </div>
  </body>
</html>
