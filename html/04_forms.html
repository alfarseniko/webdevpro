<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h1>Login Forms</h1>
    <form action="">
        <label for="email">
            Email:
            <input type="text" name="email">
        </label>
        <label for="password">
            Password:
            <input type="password" name="password" id="">
            <button type="submit">Submit</button>
        </label>
    </form>

    <div>
        <h2>Learning Form</h2>
        <form action="">
            <label for="email">
                Email:
                <input type="checkbox" name="email" id="">
            </label>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
